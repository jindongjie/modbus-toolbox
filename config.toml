[DTSD1352]
main_mode = "rtu-client"   # RS485 Modbus-RTU; tool acts as master/client
tcp_port = 502
tcp_host = "127.0.0.1"     # unused in rtu-* modes
unit = 1                   # doc: Modbus address range 1..247 (default not stated)
holding_count = 8196       # >= (max holding addr 0x2002 + 1 reg) + 1
coil_count = 0             # no coils in this map
discrete_count = 0         # no discrete inputs in this map
input_count = 0            # no 3xxxx input registers in this map
client_tick_ms = 200
ui_tick_ms = 10
device = "/dev/ttyUSB0"
baudrate = 9600            # menu supports 1200..19200; default not stated
databits = 8
parity = "n"               # doc: no parity (None) for Modbus
stopbits = 1
flow = "none"
reg_format = "u16"         # default: every plain register is unsigned 16-bit

[DTSD1352.labels]
